services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gacha
      POSTGRES_USER: gacha
      POSTGRES_PASSWORD: gacha
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gacha -d gacha"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - gacha_postgres:/var/lib/postgresql/data
      - ./migrations/000001_gacha_runtime_state.up.sql:/docker-entrypoint-initdb.d/000001_gacha_runtime_state.sql:ro
      - ./migrations/000002_pull_processing_lease.up.sql:/docker-entrypoint-initdb.d/000002_pull_processing_lease.sql:ro
      - ./migrations/000003_pull_unattended_recovery.up.sql:/docker-entrypoint-initdb.d/000003_pull_unattended_recovery.sql:ro

  kafka:
    image: redpandadata/redpanda:v24.3.7
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://kafka:9092,external://127.0.0.1:19092
    ports:
      - "127.0.0.1:19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  gacha-engine-service:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      PORT: "8080"
      INTERNAL_TOKEN: local-dev-token
      GACHA_STATE_DATABASE_URL: postgresql://gacha:gacha@db:5432/gacha
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: gacha.pull_completed.v1
      KAFKA_CLIENT_ID: gacha-engine-service
    ports:
      - "127.0.0.1:8082:8080"

volumes:
  gacha_postgres:
