apiVersion: apps/v1
kind: Deployment
metadata:
  name: gacha-engine-service
  namespace: gacha-engine-service
  labels:
    app.kubernetes.io/name: gacha-engine-service
    app.kubernetes.io/part-of: gacha-engine-service
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gacha-engine-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gacha-engine-service
        app.kubernetes.io/part-of: gacha-engine-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gacha-engine-service
          image: ghcr.io/yinlerens/gacha-engine-service@sha256:e579db5e585658abd601ce60478d46898e536469a8173cbfe67206026c7f4233
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gacha-engine-service-secrets
                  key: internal-token
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: gacha-engine-service-secrets
                  key: redis-url
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: gacha-engine-service-secrets
                  key: kafka-bootstrap-servers
            - name: KAFKA_TOPIC
              value: gacha.pull_completed.v1
            - name: KAFKA_CLIENT_ID
              value: gacha-engine-service
            - name: REDIS_KEY_PREFIX
              value: gacha:pity
            - name: GACHA_CONFIG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gacha-engine-service-secrets
                  key: gacha-config-database-url
          startupProbe:
            httpGet:
              port: http
              path: /health
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              port: http
              path: /ready
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              port: http
              path: /health
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

